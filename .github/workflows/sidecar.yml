name: Sidecar

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after both architectures pass
        type: boolean
        default: false
      release_tag:
        description: Existing version tag to build (required for publishing; otherwise optional)
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: sidecar-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate manual request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.package.outputs.commit }}
      version: ${{ steps.package.outputs.version }}
    env:
      PUBLISH: ${{ inputs.publish }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Require an explicit version tag for publishing
        run: |
          if [[ "$PUBLISH" == true && -z "$RELEASE_TAG" ]]; then
            echo 'Publishing requires an existing version tag in release_tag.' >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Use a version tag such as v0.1.0 or v0.1.0-rc.1.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - name: Validate version and freeze the selected commit
        id: package
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          python3 packaging/release.py version "${args[@]}" --github-output "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  packages:
    name: Test and package (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PUBLISH: ${{ inputs.publish }}
      BUILD_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Validate release tooling
        run: python3 -B -m unittest discover -s packaging -p 'test_*.py'
      - uses: docker/setup-buildx-action@v4
      - name: Test Rust, Python and the systemd unit; assemble installer fixture
        uses: docker/build-push-action@v7
        with:
          context: .
          target: installer-test
          platforms: linux/${{ matrix.arch }}
          tags: sidecar:installer-test
          load: true
          cache-from: type=gha,scope=sidecar-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sidecar-${{ matrix.arch }}
      - name: Test the packaged installer and recovery
        run: timeout 240s docker run --rm --init --name sidecar-installer-check --network none sidecar:installer-test
      - name: Export the Linux archive
        uses: docker/build-push-action@v7
        with:
          context: .
          target: archive
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=sidecar-${{ matrix.arch }}
      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          tags: sidecar:ci
          load: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=sidecar-${{ matrix.arch }}
      - name: Verify checksums and test image/archive setup, updates and recovery
        shell: bash
        run: |
          (cd dist && sha256sum --check ./*.sha256)
          archives=(dist/*.tar.gz)
          [[ ${#archives[@]} -eq 1 ]]
          python3 -B experiments/packaging.py --image sidecar:ci --archive "${archives[0]}"
      - name: Preserve the tested image for publishing
        if: inputs.publish
        run: |
          mkdir -p image
          docker save sidecar:ci | gzip -1 > image/image.tar.gz
      - name: Record tested artifact identities
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--image-file image/image.tar.gz); fi
          python3 packaging/release.py record --arch "$ARCH" --commit "$BUILD_COMMIT" "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: inputs.publish
        with:
          name: image-${{ matrix.arch }}
          path: image/image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Clean up a timed-out installer
        if: always()
        run: docker rm --force sidecar-installer-check >/dev/null 2>&1 || true

  publish:
    name: Publish tested release
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [prepare, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: packages-*
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: image-*
      - name: Validate both architectures before publishing
        run: python3 packaging/release.py verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --directory artifacts
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish versioned images and GitHub release assets
        run: bash packaging/publish.sh
