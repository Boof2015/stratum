[package]
name = "stratum-poc"
default-run = "stratum-poc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "An experimental sample-addressed adaptive audio engine"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "test-util", "process", "fs"] }
tokio-util = "0.7"
getrandom = "0.3"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
argon2 = "0.5.3"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
time = "0.3"
fs2 = "0.4"
rpassword = "7"
subtle = "2"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

tower = { version = "0.5", features = ["util"] }
