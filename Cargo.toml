[package]
name = "stratum-poc"
default-run = "stratum-poc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "An experimental sample-addressed adaptive audio engine"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "test-util"] }
tokio-util = "0.7"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
